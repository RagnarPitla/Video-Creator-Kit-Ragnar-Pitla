<!-- Monoline icon set for editorial-style posters.
     Every symbol is a 24x24 viewBox drawn in strokes only, no fills, using
     stroke="currentColor" so an icon inherits the colour of the box it sits
     in. That is the whole point: in this style the box border, the icon and
     the label are one colour, and the poster reads as a set of families.
     Stroke width is 1.8 at 24px. Do not add fills -- a filled icon next to
     these reads as a different weight class and breaks the row. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.4"/>
    <path d="M5.5 19.5c0-3.6 2.9-5.6 6.5-5.6s6.5 2 6.5 5.6"/>
  </symbol>

  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 15.2a2.4 2.4 0 0 1-2.4 2.4H8.4L4 21V6.4A2.4 2.4 0 0 1 6.4 4h11.2A2.4 2.4 0 0 1 20 6.4z"/>
  </symbol>

  <symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="2.2"/>
    <circle cx="12" cy="4.4" r="1.9"/><circle cx="12" cy="19.6" r="1.9"/>
    <circle cx="4.9" cy="8" r="1.9"/><circle cx="19.1" cy="8" r="1.9"/>
    <circle cx="4.9" cy="16" r="1.9"/><circle cx="19.1" cy="16" r="1.9"/>
    <path d="M12 6.3v3.5M12 14.2v3.5M6.6 9l3.5 2M13.9 13l3.5 2M6.6 15l3.5-2M13.9 11l3.5-2"/>
  </symbol>

  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.4"/><path d="M8.4 12.2l2.6 2.6 4.6-5.2"/>
  </symbol>

  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/>
  </symbol>

  <symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.2" y="7.6" width="15.6" height="11.4" rx="2.6"/>
    <path d="M12 4.2v3.4"/><circle cx="12" cy="3.3" r="1.1"/>
    <circle cx="9.2" cy="12.6" r="1.05"/><circle cx="14.8" cy="12.6" r="1.05"/>
    <path d="M9.6 15.9h4.8M1.9 11.4v3.6M22.1 11.4v3.6"/>
  </symbol>

  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4L20 20"/>
