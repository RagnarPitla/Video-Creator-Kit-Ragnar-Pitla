  <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8.8" cy="8.2" r="2.9"/><path d="M3.4 19c0-3.1 2.4-4.9 5.4-4.9s5.4 1.8 5.4 4.9"/>
    <path d="M16.1 5.6a2.9 2.9 0 0 1 0 5.5M17.2 14.4c2.1.5 3.4 2.1 3.4 4.6"/>
  </symbol>

  <symbol id="i-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.2" y="3.4" width="6" height="5" rx="1.4"/>
    <rect x="14.8" y="15.6" width="6" height="5" rx="1.4"/>
    <path d="M6.2 8.4v6.2a3 3 0 0 0 3 3h5.6"/>
